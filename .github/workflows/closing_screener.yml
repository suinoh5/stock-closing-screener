name: Daily Stock Closing Screener

on:
  schedule:
    # 한국 시간(KST) 매주 월~금 오후 15:10 자동 실행 (UTC 06:10)
    - cron: '10 6 * * 1-5'
  workflow_dispatch: # 지금 즉시 수동 실행 버튼

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Closing Screener and Send Gmail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}
        run: |
          python closing_screener_v3.py
